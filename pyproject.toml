[build-system]
requires = ["setuptools>=84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "mangadex-dl"
version = "1.0.0"
description = "Downloader moderno em GUI (PyQt5) e CLI para MangaDex, MangaLivre e fontes web."
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "Carlos Junior" }
]
dependencies = [
    "PyQt5>=5.15.11",
    "requests>=2.34.2",
    "urllib3>=2.7.0",
    "beautifulsoup4>=4.15.0",
    "tqdm>=4.70.0",
]

[project.optional-dependencies]
dev = [
    "playwright>=1.62.0",
    "pyinstaller>=6.22.2",
    "ruff>=0.16.5",
    "bandit>=1.9.4",
    "pip-audit>=2.10.1",
]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "B", "S"]
ignore = [
    "E501",  # Comprimento de linha gerenciado
    "S311",  # Pseudo-random não criptográfico (não usado para segurança)
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S105", "S106"]  # Permite asserts em testes

[tool.bandit]
exclude_dirs = ["tests", "build", "dist", ".venv", "venv"]
skips = ["B311", "B101"]
